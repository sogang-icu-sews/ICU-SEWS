services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SEWS_USE_MOCK_MODEL: ${SEWS_USE_MOCK_MODEL:-true}
      SEWS_MODEL_DIR: /app/artifacts
      MLFLOW_TRACKING_URI: file:/app/mlruns
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      SEWS_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
