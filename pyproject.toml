[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icu-sews"
version = "0.1.0"
description = "Educational ICU sepsis early warning system using PhysioNet Challenge 2019 data"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "joblib>=1.4,<2.0",
  "mlflow>=2.17,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<7.0",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "scikit-learn>=1.5,<2.0",
  "shap>=0.46,<1.0",
  "streamlit>=1.39,<2.0",
  "torch>=2.4,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "xgboost>=2.1,<4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icu_sews"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
